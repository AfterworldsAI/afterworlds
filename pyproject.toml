[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "afterworlds"
version = "0.1.0"
description = "Afterworlds interactive storytelling platform built on the Sojourn Story State Machine"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    # Exact pin (#205): failed-construction cleanup in api/app.py reads
    # chromadb.api.shared_system_client.SharedSystemClient's private
    # system/refcount registries, verified on 1.5.9 only. Changing this pin
    # requires a deliberate compatibility review of that code.
    "chromadb==1.5.9",
    "anthropic>=0.40",
    "keyring>=24.0",
    "openai>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # SRD corpus transform (CRD Issue 5c). Pinning the extractor protects
    # operationally meaningful extraction behavior. Deliberate compatibility
    # changes bump the semantic transform version and yield a new draft release.
    "pdfplumber==0.11.10",
    "pdfminer.six==20260107",
]

[project.optional-dependencies]
dev = [
    "black==26.3.1",
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "pip-audit>=2.7",
    "detect-secrets>=1.5",
    "httpx>=0.27",
    # Packaging smoke tests (CRD Issues 5c/5d): build wheel+sdist to verify the
    # current accepted authority ships and resolves from an installed
    # distribution, while retired products and superseded intermediates do not.
    # `build --no-isolation` uses the current env's build backend, so the declared
    # `[build-system].requires` (setuptools>=83.0.0, wheel) must be present here too
    # (R17: a clean CI runner lacked `wheel`, so the build exited 1).
    "build>=1.0",
    # 83.0.0 fixes CVE-2026-59890 (MANIFEST.in exclude/prune Unicode matching).
    "setuptools>=83.0.0",
    "wheel",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
afterworlds = [
    "modes/personas/profiles/*.json",
    # CRD Issue 5d committed accepted oracles, resolved at runtime by
    # oracle.committed_oracle_for from the fixed packaged directory. The current
    # accepted authority is the SRD 5.2.1 release 5.2.1-corpus.8781d4e0-a3b, as
    # recorded by its CRD Issue 15b C9 successor artifact, so the glob must ship it, or an installed distribution would resolve no
    # accepted authority and publication would return ABSENT.
    "ingestion/mechanical/oracles/*.json",
    # #205: both Alembic chains (content, control) ship with the package so an
    # installed remote startup can migrate; resolved package-relative by
    # api/db_bootstrap.py and remote/control_store.py.
    "migrations/content/env.py",
    "migrations/content/script.py.mako",
    "migrations/content/versions/*.py",
    "migrations/control/env.py",
    "migrations/control/script.py.mako",
    "migrations/control/versions/*.py",
]

[tool.setuptools.exclude-package-data]
afterworlds = [
    # Superseded intermediate releases. Resolution refuses them by release
    # version before reading the directory, so an installed application never
    # needs them; they stay in the source tree only for test and replay evidence.
    # The last five are the release's predecessor artifact, its CRD Issue 2b
    # G1 successor, its CRD Issue 15c native C5 successor and its CRD Issue 15c
    # C7 and C8 successors, each superseded by digest
    # (oracle.SUPERSEDED_ORACLE_SHA256); the CRD Issue 15b C9 successor ships.
    "ingestion/mechanical/oracles/srd-5-2-1-corpus-3fe24ff6-4e3.json",
    "ingestion/mechanical/oracles/srd-5-2-1-corpus-574662e9-0ef.json",
    "ingestion/mechanical/oracles/srd-5-2-1-corpus-8781d4e0-a3b.json",
    "ingestion/mechanical/oracles/srd-5-2-1-corpus-8781d4e0-a3b-g1.json",
    "ingestion/mechanical/oracles/srd-5-2-1-corpus-8781d4e0-a3b-15c.json",
    "ingestion/mechanical/oracles/srd-5-2-1-corpus-8781d4e0-a3b-15c-c7.json",
    "ingestion/mechanical/oracles/srd-5-2-1-corpus-8781d4e0-a3b-15c-c8.json",
]

# ---------------------------------------------------------------------------
# Black
# ---------------------------------------------------------------------------
[tool.black]
target-version = ["py312"]
line-length = 88
# The Alembic chains moved under src/ only so they ship (#205); they were never
# formatted, linted, type-checked or coverage-measured before, and stay so.
extend-exclude = "src/afterworlds/migrations/"

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["src/afterworlds/migrations"]  # see [tool.black]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency-injection idiom is `param: T = Depends(...)`; this is
# not the mutable-default-argument footgun B008 targets.
"src/afterworlds/api/routes/*.py" = ["B008"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
exclude = ["src/afterworlds/migrations/"]  # see [tool.black]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short --cov=src/afterworlds --cov-report=term-missing --cov-fail-under=80"
pythonpath = ["."]

[tool.coverage.run]
omit = ["*/afterworlds/migrations/*"]  # see [tool.black]
