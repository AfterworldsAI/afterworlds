[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "afterworlds"
version = "0.1.0"
description = "Afterworlds interactive storytelling platform built on the Sojourn Story State Machine"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "chromadb>=0.5",
    "anthropic>=0.40",
    "keyring>=24.0",
    "openai>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # SRD corpus transform (CRD Issue 5c). Pinned exactly: the corpus release is
    # byte-for-byte reproducible only against a fixed extractor version. The
    # transform records these identities (Component B); bumping either version is
    # a transform-config change that yields a new draft release (Component A).
    "pdfplumber==0.11.10",
    "pdfminer.six==20260107",
]

[project.optional-dependencies]
dev = [
    "black==26.3.1",
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "pip-audit>=2.7",
    "detect-secrets>=1.5",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
afterworlds = ["modes/personas/profiles/*.json"]

# ---------------------------------------------------------------------------
# Black
# ---------------------------------------------------------------------------
[tool.black]
target-version = ["py312"]
line-length = 88

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency-injection idiom is `param: T = Depends(...)`; this is
# not the mutable-default-argument footgun B008 targets.
"src/afterworlds/api/routes/*.py" = ["B008"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short --cov=src/afterworlds --cov-report=term-missing --cov-fail-under=80"
pythonpath = ["."]
