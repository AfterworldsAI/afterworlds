name: Auto-resolve Codex review comments

on:
  pull_request_review:
    types: [submitted]

jobs:
  auto-fix:
    # Only run when Codex submits a "changes requested" review.
    if: >
      github.event.review.state == 'changes_requested' &&
      github.event.review.user.login == 'chatgpt-codex-connector[bot]'

    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Create GitHub App token for push/comment operations
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.AUTO_FIX_APP_ID }}
          private-key: ${{ secrets.AUTO_FIX_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Debug review event
        shell: bash
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "review_state=${{ github.event.review.state }}"
          echo "review_user=${{ github.event.review.user.login }}"
          echo "pr_number=${{ github.event.pull_request.number }}"
          echo "review_id=${{ github.event.review.id }}"

      - name: Check auto-fix iteration count
        id: check_iterations
        shell: bash
        run: |
          COUNT=$(git log --oneline --format="%s" | grep -c "^auto-fix:" || true)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

          if [ "$COUNT" -ge 3 ]; then
            echo "cap_reached=true" >> "$GITHUB_OUTPUT"
          else
            echo "cap_reached=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post cap-reached comment and halt
        if: steps.check_iterations.outputs.cap_reached == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body "⚠️ **Auto-fix loop reached iteration cap (3 attempts).** This PR needs owner review before further automated fixes can run."
          exit 0

      - name: Fetch Codex review summary and inline comments
        id: review_data
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          REVIEW_ID="${{ github.event.review.id }}"
          REVIEW_FILE="$RUNNER_TEMP/codex_review.txt"

          REVIEW_BODY=$(gh api \
            "/repos/${{ github.repository }}/pulls/reviews/$REVIEW_ID" \
            --jq '.body // "(no summary provided)"')

          INLINE=$(gh api \
            "/repos/${{ github.repository }}/pulls/$PR_NUMBER/comments" \
            --jq --argjson rid "$REVIEW_ID" '
              [
                .[]
                | select(.pull_request_review_id == $rid)
                | "### " + .path + " (line " + ((.line // .original_line // 0) | tostring) + ")\n" + .body
              ] | join("\n\n---\n\n")
            ')

          {
            echo "# Codex Review — PR #$PR_NUMBER"
            echo
            echo "## Review Summary"
            echo "$REVIEW_BODY"
            echo
            echo "## Inline Comments"
            if [ -n "$INLINE" ]; then
              echo "$INLINE"
            else
              echo "(no inline comments)"
            fi
          } > "$REVIEW_FILE"

          echo "review_file=$REVIEW_FILE" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.app-token.outputs.token }}
          prompt: |
            You are resolving review comments from Codex on a pull request.

            Files available to read in the repository and runner:
            - ${{ steps.review_data.outputs.review_file }}
            - CLAUDE.md (if present)
            - docs/architecture/known_unknowns.md (if present)

            Your job:
            1. Read ${{ steps.review_data.outputs.review_file }} carefully.
            2. Treat any comment prefixed with [OWNER DECISION] as out of scope.
            3. Also treat any comment that requires a design, architectural, ethical,
               product, or policy judgment as an owner decision even if it is not labeled.
            4. Fix only concrete implementation issues that can be addressed
               confidently inside the existing PR scope.
            5. Do not modify any file under .github/workflows/.
            6. Do not change CI thresholds or gate settings.
            7. Do not resolve Known Unknowns from docs/architecture/known_unknowns.md.
            8. Do not widen scope beyond the review comments.
            9. If you encounter owner-decision items, write them to a file named
               ${{ runner.temp }}/owner_decisions_report.md as a markdown bullet list.
               If there are none, do not create that file.
            10. When you are done editing files, stop. Do not commit. Do not push.

          claude_args: "--max-turns 10"

      - name: Post owner-decision summary if present
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          REPORT_FILE="$RUNNER_TEMP/owner_decisions_report.md"
          COMMENT_FILE="$RUNNER_TEMP/owner_decisions_comment.md"

          if [ ! -f "$REPORT_FILE" ]; then
            echo "No owner-decision report present."
            exit 0
          fi

          {
            echo "⚠️ **Items requiring owner decision**"
            echo
            cat "$REPORT_FILE"
          } > "$COMMENT_FILE"

          gh pr comment "${{ github.event.pull_request.number }}" \
            --body-file "$COMMENT_FILE"

      - name: Configure git identity
        id: git_identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          USER_ID=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)
          echo "user_id=$USER_ID" >> "$GITHUB_OUTPUT"

          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${USER_ID}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"

      - name: Commit changes if any
        id: commit_changes
        shell: bash
        run: |
          git add -A

          if git diff --cached --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "auto-fix: resolve Codex review comments"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Push fixes
        if: steps.commit_changes.outputs.committed == 'true'
        shell: bash
        run: |
          git push origin "${{ github.event.pull_request.head.ref }}"
