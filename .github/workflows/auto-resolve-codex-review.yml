name: Decommissioned — Auto-resolve Codex review comments

on:
  workflow_dispatch:

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Explain retirement
        run: |
          echo "This workflow has been retired."
          echo "Reason: the PR auto-fix loop was unreliable and could apply unsafe out-of-scope changes."
          echo "Replacement direction: separate review/classification automation from explicit-approval-only fix automation."
          echo "This workflow is manual-only and performs no repository modifications."
