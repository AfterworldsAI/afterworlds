name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Lint, Type-check, Test, Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Formatting — Black
        run: black --check src/ tests/

      - name: Linting — Ruff
        run: ruff check src/ tests/

      - name: Type checking — mypy (strict)
        run: mypy src/

      - name: Tests — pytest
        # --durations=25 surfaces the slowest tests each run (visibility only; no
        # wall-clock failure threshold). addopts (pyproject) has no --durations.
        run: pytest --cov=src --durations=25

      - name: Dependency audit — pip-audit
        # CVE-2026-4539: ReDoS in pygments AdlLexer (pygments/lexers/archetype.py).
        # Affects pygments <=2.19.2. No patched release exists upstream as of 2026-03-27.
        # Remove --ignore-vuln once pygments ships a fix and the dep is updated.
        # CVE-2026-3219: vulnerability in pip affecting versions through 26.0.1.
        # No patched pip release exists upstream yet. This CI job upgrades pip before
        # auditing, so we are temporarily ignoring this CVE to keep the audit gate
        # usable. Remove this ignore once pip ships a fixed release and CI is pinned
        # or upgraded to that version.
        # CVE-2026-45829 / PYSEC-2026-311 / GHSA-f4j7-r4q5-qw2c: pre-auth code-injection
        # in chromadb's HTTP server component — an unauthenticated attacker can run
        # arbitrary code via a malicious model repository with trust_remote_code=True
        # on the `/api/v2/tenants/{tenant}/databases/{db}/collections` endpoint. No
        # patched release exists upstream as of 2026-07-05 (affects every chromadb
        # release 1.0.0-1.5.9 inclusive).
        #
        # CRD Issue 18 / ADR-018 resolution (safe-deployment-path, dependency kept —
        # not scoped optional, since Retrieval Memory is a first-class memory layer
        # required on every access path per CLAUDE.md invariant 2 / the BYOK-parity
        # business invariant): the vulnerable surface is chromadb's standalone HTTP
        # server (`chromadb run` / `HttpClient`) plus trust_remote_code=True on an
        # embedding function. Afterworlds never runs that server process and never
        # sets trust_remote_code=True anywhere — every client is constructed via
        # `pipeline/retrieval/client.py::build_chroma_client`, which only ever
        # returns an embedded `PersistentClient`/`EphemeralClient`. See that module
        # and `pipeline/retrieval/config.py::RetrievalMemoryConfig` for the enforced
        # boundary, and this PR's Architecture Notes for the full write-up. Re-justified
        # (not silently preserved) per ADR-018's Phase 2 CVE-closure requirement.
        # Revisit if chromadb ships a patched release, or if a server-mode deployment
        # is ever proposed (which would require a new safe-deployment review).
        run: pip-audit --ignore-vuln CVE-2026-4539 --ignore-vuln CVE-2026-3219 --ignore-vuln CVE-2026-45829

  frontend:
    name: Frontend — Typecheck, Lint, Format, Test, Audit, Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node (pinned LTS)
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python package (for OpenAPI schema generation)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
        working-directory: .

      - name: Install dependencies
        run: npm ci

      - name: Type checking — tsc --noEmit
        run: npm run typecheck

      - name: Linting — ESLint
        run: npm run lint

      - name: Formatting — Prettier
        run: npm run format:check

      - name: Tests — Vitest
        run: npm run test

      - name: Dependency audit — npm audit
        run: npm audit --audit-level=high

      - name: OpenAPI TS types drift check
        run: npm run check-api-types-drift

      - name: Production build
        run: npm run build

  e2e:
    name: E2E — minimal spine (Playwright, faked provider passes)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node (pinned LTS)
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Run E2E spine
        # DoR-B: AFTERWORLDS_FAKE_PROVIDER=1 (set in playwright.config.ts's
        # webServer env) -- no real Anthropic calls in default CI.
        # Round 12 remediation (PR #126 P2): `npm run e2e` (not
        # `npx playwright test` directly) is required -- it wraps Playwright
        # via e2e/run-isolated.mjs, which computes one per-run isolated
        # database path shared by the webServer and every test worker.
        run: npm run e2e
        working-directory: frontend
